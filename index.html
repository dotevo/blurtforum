<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlurtForum - Blockchain Powered Community</title>
<meta name="description" content="BlurtForum is a decentralized community platform powered by the Blurt blockchain. Engage, post, and earn rewards.">
<link rel="canonical" href="https://forum.blurt.pl/">
<!-- Default RPC node (see DEFAULT_RPC in src/composables/useRpc.ts) -- the
     app doesn't request anything from it until its JS bundle has loaded
     and run, well into the page-load waterfall. Preconnecting here lets
     the browser get DNS/TCP/TLS out of the way in parallel with everything
     else, so the first real RPC call doesn't have to pay that cost cold. -->
<link rel="preconnect" href="https://rpc.drakernoise.com">
<link rel="dns-prefetch" href="https://rpc.drakernoise.com">
<!-- Kept in sync (and rebuilt per view) at runtime by syncSeoTags() in
     src/modules/seo.ts. These are just the pre-JS fallback for the bare
     homepage — one per supported UI language in translations.ts, so
     Google can discover and crawl each language variant on its own. -->
<link rel="alternate" hreflang="en" href="https://forum.blurt.pl/?lang=en">
<link rel="alternate" hreflang="pl" href="https://forum.blurt.pl/?lang=pl">
<link rel="alternate" hreflang="eo" href="https://forum.blurt.pl/?lang=eo">
<link rel="alternate" hreflang="de" href="https://forum.blurt.pl/?lang=de">
<link rel="alternate" hreflang="fr" href="https://forum.blurt.pl/?lang=fr">
<link rel="alternate" hreflang="es" href="https://forum.blurt.pl/?lang=es">
<link rel="alternate" hreflang="x-default" href="https://forum.blurt.pl/">
<meta property="og:title" content="BlurtForum">
<meta property="og:description" content="Blockchain-powered community platform on the Blurt network.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://forum.blurt.pl/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="BlurtForum">
<meta name="twitter:description" content="Decentralized community platform on the Blurt network.">
<meta name="google-site-verification" content="x4oZFeWKLhPUmFzLrBuGhSZunnWbT93DjQuk17VtmP0" />
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14171c">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script src="./vendor/dblurt/dblurt.js" defer></script>
<script src="./vendor/peertube-embed-api/player.min.js" defer></script>
<!-- Was a plain blocking <link rel="stylesheet"> -- Lighthouse flags any
     synchronous stylesheet in <head> as a render-blocking request (this
     was the ~450ms "render-blocking requests" finding, essentially the
     only candidate for it on this page: the two <script> tags above are
     already `defer`, and nothing else in <head> is a stylesheet). The
     icon font is already a small (~9KB) subset (see
     scripts/subset-fontawesome.mjs) and nothing above the fold strictly
     needs it painted before first content, so it's safe to let it load in
     parallel: `rel="preload" as="style"` fetches it with page-load
     priority without blocking rendering, then the `onload` swaps it to a
     real stylesheet once it's actually in cache. <noscript> covers the
     (rare) no-JS case, where the onload trick can't run.
     See style.css's `.fa-solid, .fa-brands` rule for the other half of
     this change -- reserving icon glyph width up front so icons don't
     visibly pop in and shift surrounding text once this loads. -->
<link rel="preload" href="./vendor/fontawesome/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css"></noscript>
<!-- Google Analytics (gtag.js) is intentionally NOT loaded here anymore --
     it only loads after the user accepts cookies via the in-app consent
     banner. See src/modules/cookie-consent.ts for the full story. -->
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
